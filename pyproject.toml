[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moltenpot"
version = "0.1.0"
description = "Offline RL benchmark for MeltingPot mixed-motive multi-agent scenarios"
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.17.0",
    "ray[default]>=2.9.0",
    "h5py>=3.10.0",
    "numpy>=1.26.0",
    "dm-env>=1.6",
    "opencv-python-headless>=4.9.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "wandb>=0.16.0",
    "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["moltenpot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
